services:
  # FastAPI backend
  - type: web
    name: sneaker-sales-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sneaker-sales-db
          property: connectionString
    plan: free

  # Scheduled job that inserts a batch of fake sales every 5 minutes,
  # keeping the deployed dashboard's data "live" without needing an
  # always-on worker.
  - type: cron
    name: sneaker-sales-generator
    env: python
    schedule: "*/5 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python generator_burst.py"
    envVars:
      - key: API_URL
        fromService:
          name: sneaker-sales-api
          type: web
          property: host

databases:
  - name: sneaker-sales-db
    plan: free
